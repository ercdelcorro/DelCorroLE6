<div class="auth-page">

  <div class="auth-box">

    <p class="small-title">MY BLOG</p>

    <h1>Create Account</h1>

    <p class="auth-subtitle">
      Make an account to get started.
    </p>

    <form
      name="form"
      (ngSubmit)="onSubmit()"
      #ngForm="ngForm"
    >

      <!-- username -->
      <div class="form-group">
        <label for="username">Username</label>

        <input
          type="text"
          name="username"
          [(ngModel)]="form.username"
          required
          #username="ngModel"
        >
      </div>

      <!-- password -->
      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="form.password"
          required
          #password="ngModel"
        >
      </div>

      <!-- first name -->
      <div class="form-group">
        <label for="firstName">First Name</label>

        <input
          type="text"
          name="firstName"
          [(ngModel)]="form.firstName"
          required
          #firstName="ngModel"
        >
      </div>

      <!-- last name -->
      <div class="form-group">
        <label for="lastName">Last Name</label>

        <input
          type="text"
          name="lastName"
          [(ngModel)]="form.lastName"
          required
          #lastName="ngModel"
        >
      </div>

      <button type="submit">
        Register
      </button>

    </form>

  </div>

</div>
