<div class="auth-page">

  <div class="auth-box">

    <p class="small-title">MY BLOG</p>

    <h1>Welcome Back</h1>

    <p class="auth-subtitle">
      Login to your account.
    </p>

    <div *ngIf="loginError" class="login-error">
      {{ loginError }}
    </div>

    <form
      name="form"
      (ngSubmit)="onSubmit()"
      #ngForm="ngForm"
      novalidate
    >

      <!-- username -->
      <div class="form-group">
        <label for="username">Username</label>

        <input
          required
          type="text"
          name="username"
          [(ngModel)]="form.username"
          #username="ngModel"
        >
      </div>

      <!-- password -->
      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="form.password"
          required
          #password="ngModel"
        >
      </div>

      <button type="submit">
        Login
      </button>

    </form>

  </div>

</div>
