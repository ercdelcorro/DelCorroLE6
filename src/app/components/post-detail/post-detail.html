<!-- post details page -->
<div class="detail-page">

  <a routerLink="/" class="back-link">
    ← Back to posts
  </a>

  <article class="post-detail">

    <p class="small-title">BLOG POST</p>

    <h1>{{ post?.title }}</h1>

    <p class="post-info">
      by {{ post?.firstName }} {{ post?.lastName }}
      · {{ post?.dateCreated | date:'MMMM d, y · h:mm a' }}
    </p>

    <div class="post-body">
      <p>
        {{ post?.body }}
      </p>
    </div>

  </article>

</div>
